<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .shell {
      width: 100%; height: 100%;
      background: #090909;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      /* Inset border glow */
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.07),
        0 40px 100px rgba(0,0,0,0.95);
      animation: appear 0.35s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* Noise texture overlay */
    .shell::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 1;
    }

    /* Red radial glow behind logo */
    .glow {
      position: absolute;
      width: 340px;
      height: 220px;
      background: radial-gradient(ellipse at center,
        rgba(255,61,61,0.11) 0%,
        rgba(255,61,61,0.04) 40%,
        transparent 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -55%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top accent line */
    .top-line {
      position: absolute;
      top: 0; left: 20%; right: 20%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        rgba(255,61,61,0.5) 30%,
        rgba(255,100,100,0.7) 50%,
        rgba(255,61,61,0.5) 70%,
        transparent);
      z-index: 2;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    /* Logo */
    .logo {
      animation: slideUp 0.55s cubic-bezier(0.16,1,0.3,1) 0.1s both;
    }

    .logo img {
      height: 90px;
      width: auto;
      display: block;
      filter: drop-shadow(0 0 18px rgba(255,61,61,0.18));
    }

    /* Tagline */
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      color: rgba(255,255,255,0.28);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      animation: slideUp 0.55s cubic-bezier(0.16,1,0.3,1) 0.3s both;
    }

    /* Bottom loading bar */
    .bar-track {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: rgba(255,255,255,0.05);
      overflow: hidden;
      border-radius: 0 0 18px 18px;
      z-index: 3;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #b52020, #ff3d3d 60%, #ff7070);
      border-radius: 0 1px 1px 0;
      animation: loadBar 2.4s cubic-bezier(0.4,0,0.2,1) 0.2s forwards;
      width: 0;
      transform-origin: left;
    }

    /* Small version badge */
    .version {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 9.5px;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.5px;
      z-index: 2;
      animation: fadeIn 0.4s ease 0.8s both;
    }

    /* ── Animations ─────────────────────────────────────────────────── */
    @keyframes appear {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes loadBar {
      0%   { width: 0%; }
      20%  { width: 22%; }
      45%  { width: 50%; }
      70%  { width: 72%; }
      88%  { width: 86%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top-line"></div>
    <div class="glow"></div>

    <div class="content">
      <div class="logo">
        <img src="./images/baroflix_square.png" alt="baroflix" draggable="false" />
      </div>
      <p class="tagline">Your cinema, your rules</p>
    </div>

    <span class="version">v1.0.0</span>

    <div class="bar-track">
      <div class="bar-fill"></div>
    </div>
  </div>
</body>
</html>
